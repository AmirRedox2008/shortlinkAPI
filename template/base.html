<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}لینک‌کوتاه{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
         :root {
            --primary: #6366f1;
            --bg: #f1f5f9;
            --text: #1e293b;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: Vazirmatn, sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        
        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }
        
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .08);
            margin-bottom: 1rem;
        }
        
        h1 {
            text-align: center;
        }
        
        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 1.5rem;
        }
        
        h4 {
            margin: .75rem 0 .5rem;
        }
        
        input {
            width: 100%;
            padding: .75rem 1rem;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            margin-bottom: .75rem;
            font-family: inherit;
            font-size: 1rem;
        }
        
        input:focus {
            outline: 2px solid var(--primary);
            border-color: transparent;
        }
        
        .row {
            display: flex;
            gap: .75rem;
        }
        
        .row>* {
            flex: 1;
        }
        
        button {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: .75rem 1.5rem;
            border-radius: 10px;
            font-family: inherit;
            font-size: 1rem;
            cursor: pointer;
        }
        
        button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }
        
        .btn-sm {
            padding: .4rem .7rem;
            font-size: .9rem;
        }
        
        .btn-ghost {
            background: transparent;
            color: var(--primary);
        }
        
        .btn-danger {
            background: transparent;
            color: #ef4444;
        }
        
        .link-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: .75rem 0;
            border-bottom: 1px solid #f1f5f9;
            gap: .5rem;
            flex-wrap: wrap;
        }
        
        .short-link {
            color: var(--primary);
            font-weight: 700;
            text-decoration: none;
            direction: ltr;
        }
        
        .original {
            color: #64748b;
            font-size: .85rem;
            direction: ltr;
            text-align: left;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 260px;
        }
        
        .actions {
            display: flex;
            gap: .25rem;
            align-items: center;
        }
        
        .badge {
            background: #eef2ff;
            color: var(--primary);
            border-radius: 999px;
            padding: .15rem .6rem;
            font-size: .8rem;
        }
        
        .alert {
            padding: .75rem 1rem;
            border-radius: 10px;
            margin-top: .75rem;
        }
        
        .alert.success {
            background: #dcfce7;
            color: #166534;
        }
        
        .alert.error {
            background: #fee2e2;
            color: #991b1b;
        }
        
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .4);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            z-index: 10;
        }
        
        .modal {
            background: #fff;
            border-radius: 16px;
            padding: 1.5rem;
            width: 100%;
            max-width: 480px;
            max-height: 85vh;
            overflow-y: auto;
        }
        
        .stat-row {
            display: flex;
            align-items: center;
            gap: .5rem;
            margin-bottom: .4rem;
        }
        
        .stat-row .date {
            font-size: .85rem;
            color: #64748b;
            min-width: 5.5rem;
            direction: ltr;
        }
        
        .bar {
            background: var(--primary);
            color: #fff;
            border-radius: 6px;
            padding: .2rem .5rem;
            font-size: .8rem;
            text-align: center;
            transition: width .3s;
        }
        
        .qr-img {
            display: block;
            margin: .5rem auto;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }
        
        .empty {
            text-align: center;
            color: #94a3b8;
            padding: 1.5rem 0;
        }
    </style>
</head>

<body>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    {% block scripts %}{% endblock %}
</body>

</html>
